apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: featureflags.featureflags.example.com
spec:
  group: featureflags.example.com
  names:
    kind: FeatureFlag
    listKind: FeatureFlagList
    plural: featureflags
    singular: featureflag
    shortNames:
      - ff
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - configMapRef
              properties:
                configMapRef:
                  type: object
                  required:
                    - name
                    - namespace
                    - key
                  properties:
                    name:
                      type: string
                      description: Name of the ConfigMap.
                    namespace:
                      type: string
                      description: Namespace of the ConfigMap.
                    key:
                      type: string
                      description: Key within the ConfigMap data to read.
                defaultValue:
                  type: string
                  description: Value to use when the ConfigMap or key does not exist.
                deploymentRef:
                  type: object
                  required:
                    - name
                    - namespace
                    - container
                    - argName
                  properties:
                    name:
                      type: string
                      description: Name of the Deployment to patch.
                    namespace:
                      type: string
                      description: Namespace of the Deployment.
                    container:
                      type: string
                      description: Name of the container within the Deployment pod spec.
                    argName:
                      type: string
                      description: >
                        Argument flag to inject into the container args, e.g. "--feature-enabled".
                        The reconciler sets or replaces the arg as "<argName>=<value>".
            status:
              type: object
              properties:
                value:
                  type: string
                  description: Current raw value of the feature flag.
                enabled:
                  type: boolean
                  description: Whether the flag evaluates to true.
                lastUpdated:
                  type: string
                  format: date-time
                  description: Timestamp of last reconciliation.
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
      additionalPrinterColumns:
        - name: Value
          type: string
          jsonPath: .status.value
        - name: Enabled
          type: boolean
          jsonPath: .status.enabled
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
